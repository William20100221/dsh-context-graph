# Mounted at the profile root so the recall tool, the matcher and the builder are available to
# every agent. Every value below is the default; restate the whole config block when you change one.
- insert:
    - id: context-graph
      name: dsh-context-graph
      config:
        dir: .context-graph        # relative to the agent workspace, or an absolute path
        buildEveryTurns: 4         # index after this many new human turns (only in chats with memory on)
        buildMinChars: 400         # ...and at least this much new text
        maxHits: 5                 # topics shown per human turn
        inlineMaxChars: 1200       # one dominant hit this short is shown verbatim, no recall needed
        surfaceMaxChats: 20        # shared chats listed on the first message of each chat
        builderMaxTokens: 8192     # thinking models spend part of this on reasoning
        builderMaxInputChars: 60000  # newest messages the indexing call reads; older ones are skipped
        rangeMaxChats: 3           # a message naming a time with no topic match lists at most this many chats...
        rangeMaxTopics: 3          # ...with this many topics each; recall("YYYY-MM-DD") shows the full day
        provider: ''               # empty: reuse the conversation's routed provider/model
        model: ''
